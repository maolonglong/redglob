name: Go

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOPROXY: "https://proxy.golang.org"
  GO_VERSION: "1.26.x"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version-file: .golangci-lint-version
      - name: Check Go module tidiness
        shell: bash
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Check dependency hygiene
        shell: bash
        run: |
          test "$(go list -m all | wc -l)" -eq 1
          test -z "$(go list -deps -f '{{if .CgoFiles}}{{.ImportPath}}{{end}}' .)"

  benchmarks:
    name: Benchmark compatibility
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: benchmarks/go.sum
      - name: Test isolated benchmark module
        working-directory: benchmarks
        env:
          CGO_ENABLED: "0"
        run: go test ./...

  experimental-simd:
    name: Experimental SIMD
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.0-rc.2
      - name: Test hardware SIMD
        env:
          CGO_ENABLED: "0"
          GOEXPERIMENT: simd
        run: go test -count=1 ./...
      - name: Test emulated SIMD
        env:
          CGO_ENABLED: "0"
          GODEBUG: simd=0
          GOEXPERIMENT: simd
        run: go test -count=1 ./...

  test:
    name: Test (${{ matrix.platform }})
    strategy:
      matrix:
        platform: [ ubuntu-latest, macos-latest, windows-latest ]
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Run tests
        run: go test -shuffle=on -v -race -count=1 -coverprofile=coverage -covermode=atomic ./...
      - name: Upload coverage report to Codecov
        if: runner.os == 'Linux'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./coverage
          disable_search: true
          fail_ci_if_error: true
          flags: unittests
          use_oidc: true
