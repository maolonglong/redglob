version: "2"

linters:
  default: standard
  enable:
    - nakedret
    - rowserrcheck
    - unconvert
    - unparam
  settings:
    nakedret:
      max-func-lines: 0 # Disallow naked returns.

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    gofumpt:
      module-path: github.com/maolonglong/redglob
      extra-rules: true
    goimports:
      local-prefixes:
        - github.com/maolonglong/redglob
